<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Fix My Text</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width: 380px; font-family: 'Assistant', sans-serif; background: #FFFDF9; padding: 10px; }
  .container { border: 1px solid #D4B483; border-radius: 12px; overflow: hidden; background: #FFFDF9; box-shadow: 0 8px 25px rgba(0,0,0,0.15); position: relative; }
  .pip-btn { position: absolute; top: 18px; right: 15px; background: none; border: none; cursor: pointer; font-size: 18px; opacity: 0.6; transition: opacity 0.2s; }
  .pip-btn:hover { opacity: 1; }
  .top { padding: 20px 15px 15px; background: #FFE8F0; border-bottom: 1px solid #E8D0B8; text-align: center; }
  .top-title { font-size: 20px; font-weight: 800; color: #444; }
  .lang-section { background: #FAF7F4; border-bottom: 1px solid #E8D0B8; padding-bottom: 5px; }
  .lang-row { display: flex; overflow-x: auto; padding: 10px; gap: 5px; justify-content: center; }
  .lang-btn { flex-shrink: 0; padding: 6px 14px; font-size: 14px; font-weight: 700; border: 1px solid transparent; background: transparent; color: #BBAA99; cursor: pointer; border-radius: 8px; font-family: 'Assistant'; transition: all 0.2s; }
  .lang-btn.on { color: #444; background: #fff; border-color: #E8D0B8; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
  .dir-row { display: flex; justify-content: center; padding: 5px 10px 10px; background: #FAF7F4; align-items: center; gap: 15px; }
  .lang-label { font-size: 15px; font-weight: 800; color: #D4B483; min-width: 90px; text-align: center; background: #fff; padding: 4px 8px; border-radius: 6px; border: 1px solid #E8D0B8; }
  .swap-btn { background: #FDF1F5; border: 1px solid #D4B483; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: transform 0.2s; }
  .swap-btn:hover { transform: scale(1.05); background: #FFD6E4; }
  .main { padding: 15px; }
  textarea { width: 100%; height: 110px; border: 1.5px solid #E8D0B8; border-radius: 10px; padding: 12px; font-size: 16px; font-family: 'Assistant'; resize: none; outline: none; margin-bottom: 12px; text-align: left; transition: border-color 0.2s; }
  textarea:focus { border-color: #D4B483; box-shadow: 0 0 0 3px rgba(212, 180, 131, 0.15); }
  .go-btn { width: 100%; padding: 14px; background: #FFD6E4; color: #444; border: 1px solid #D4B483; border-radius: 10px; font-size: 17px; font-weight: 800; cursor: pointer; transition: background 0.2s; }
  .go-btn:hover { background: #FFC2D6; }
  .result { display: none; margin-top: 15px; border: 1px solid #D4B483; border-radius: 10px; padding: 15px; background: #fff; animation: fadeIn 0.3s ease; }
  .copy-btn { width: 100%; padding: 10px; background: #FAF7F4; border: 1px solid #E8D0B8; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 10px; font-family: 'Assistant'; transition: all 0.2s; }
  .copy-btn:hover { background: #E8D0B8; color: #fff; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="container">
  <button class="pip-btn" id="pipBtn" title="Open floating window">🗗</button>
  <div class="top"><div class="top-title">Fix My Text</div></div>
  <div class="lang-section">
    <div class="lang-row">
      <button class="lang-btn on" data-lang="he" data-name="עברית">עברית</button>
      <button class="lang-btn" data-lang="en" data-name="English">English</button>
      <button class="lang-btn" data-lang="ru" data-name="Русский">Русский</button>
      <button class="lang-btn" data-lang="ar" data-name="العربية">العربية</button>
    </div>
    <div class="dir-row">
      <span class="lang-label" id="srcLabel">English</span>
      <button class="swap-btn" id="swapBtn" title="Swap languages">⇄</button>
      <span class="lang-label" id="trgLabel">עברית</span>
    </div>
  </div>
  <div class="main">
    <textarea id="txt" placeholder="Type text to fix..."></textarea>
    <button class="go-btn" id="goBtn">Fix My Text</button>
    <div class="result" id="resultArea">
      <div id="resultTxt" style="font-size: 17px; line-height: 1.5; white-space: pre-wrap; text-align: left;"></div>
      <button class="copy-btn" id="copyBtn">Copy Result</button>
    </div>
  </div>
</div>

<script>
  const MAP_EN = ["q","w","e","r","t","y","u","i","o","p","[","]","a","s","d","f","g","h","j","k","l",";","'","z","x","c","v","b","n","m",",",".","/","\\","`","-","="];
  const MAP_HE = ["/","'","ק","ר","א","ט","ו","ן","ם","פ","[","]","ש","ד","ג","כ","ע","י","ח","ל","ך","ף",",","ז","ס","ב","ה","נ","מ","צ","ת","ץ",".","\\",";","-","="];
  const MAP_RU = ["й","ц","у","к","е","н","г","ш","щ","з","х","ъ","ф","ы","в","а","п","р","о","л","д","ж","э","я","ч","ס","м","и","т","ь","б","ю",".","\\","ё","-","="];
  const MAP_AR = ["ض","ص","ث","ק","ف","غ","ע","ה","خ","ח","ج","ד","ש","ס","י","ב","ل","א","ת","נ","מ","כ","ط","ئ","ء","ؤ","ר","ل","ا","ى","ة","ו","ז","ظ","ذ","-","="];

  const layouts = { "en": MAP_EN, "he": MAP_HE, "ru": MAP_RU, "ar": MAP_AR };
  const langNames = { "en": "English", "he": "עברית", "ru": "Русский", "ar": "العربية" };
  
  let srcL = "en";
  let trgL = "he";

  let currentDoc = document;

  function translateText() {
    const input = currentDoc.getElementById('txt').value;
    if(!input.trim()) {
      currentDoc.getElementById('resultArea').style.display = 'none';
      return;
    }

    const sMap = layouts[srcL], tMap = layouts[trgL];
    let res = "";

    for (let char of input) {
      let isUpperCase = (char === char.toUpperCase() && char !== char.toLowerCase());
      let low = char.toLowerCase();
      let idx = sMap.indexOf(low);

      if (idx !== -1) {
        let targetChar = tMap[idx];
        res += isUpperCase ? targetChar.toUpperCase() : targetChar;
      } else {
        res += char;
      }
    }

    currentDoc.getElementById('resultTxt').innerText = res;
    currentDoc.getElementById('resultArea').style.display = 'block';
  }

  document.getElementById('goBtn').onclick = translateText;
  document.getElementById('txt').oninput = translateText;

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.onclick = () => {
      currentDoc.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      trgL = btn.dataset.lang;
      currentDoc.getElementById('trgLabel').innerText = langNames[trgL];
      translateText();
    };
  });

  document.getElementById('swapBtn').onclick = () => {
    [srcL, trgL] = [trgL, srcL];
    currentDoc.getElementById('srcLabel').innerText = langNames[srcL];
    currentDoc.getElementById('trgLabel').innerText = langNames[trgL];
    
    currentDoc.querySelectorAll('.lang-btn').forEach(b => {
      b.classList.toggle('on', b.dataset.lang === trgL);
    });
    
    currentDoc.getElementById('txt').style.direction = (srcL === 'he' || srcL === 'ar') ? 'rtl' : 'ltr';
    currentDoc.getElementById('txt').style.textAlignment = (srcL === 'he' || srcL === 'ar') ? 'right' : 'left';
    translateText();
  };

  // פונקציית העתקה רובסטית שעוקפת את מגבלת הלוח (Clipboard) של חלונות צפים
  function handleCopy() {
    const textToCopy = currentDoc.getElementById('resultTxt').innerText;
    
    // אסטרטגיית העתקה משולבת: מנסה להשתמש בלוח של הדפדפן הראשי (window) כדי לעקוף חסימת PiP
    const targetClipboard = (window.navigator && window.navigator.clipboard) ? window.navigator.clipboard : navigator.clipboard;
    
    targetClipboard.writeText(textToCopy).then(() => {
      const btn = currentDoc.getElementById('copyBtn');
      const originalText = btn.innerText;
      btn.innerText = "Copied! ✓";
      btn.style.background = "#D4B483";
      btn.style.color = "#fff";
      
      setTimeout(() => {
        btn.innerText = originalText;
        btn.style.background = "#FAF7F4";
        btn.style.color = "#444";
      }, 2000);
    }).catch(err => {
      // גיבוי למקרה שהדפדפן עדיין חוסם - העתקה באמצעות יצירת אלמנט זמני
      const textArea = currentDoc.createElement("textarea");
      textArea.value = textToCopy;
      currentDoc.body.appendChild(textArea);
      textArea.select();
      try {
        currentDoc.execCommand('copy');
        const btn = currentDoc.getElementById('copyBtn');
        const originalText = btn.innerText;
        btn.innerText = "Copied! ✓";
        btn.style.background = "#D4B483";
        btn.style.color = "#fff";
        setTimeout(() => {
          btn.innerText = originalText;
          btn.style.background = "#FAF7F4";
          btn.style.color = "#444";
        }, 2000);
      } catch (e) {
        console.error("Fallback copy failed", e);
      }
      currentDoc.body.removeChild(textArea);
    });
  }

  document.getElementById('copyBtn').onclick = handleCopy;

  document.getElementById('pipBtn').onclick = async () => {
    if ('documentPictureInPicture' in window) {
      try {
        const pipWindow = await window.documentPictureInPicture.requestWindow({
          width: 390,
          height: 520
        });
        
        document.querySelectorAll('style, link[rel="stylesheet"]').forEach((style) => {
          pipWindow.document.head.appendChild(style.cloneNode(true));
        });
        
        const container = document.querySelector('.container');
        pipWindow.document.body.appendChild(container);
        pipWindow.document.body.style.margin = '0';
        pipWindow.document.body.style.background = '#FFFDF9';
        
        currentDoc = pipWindow.document;
        currentDoc.getElementById('copyBtn').onclick = handleCopy;
        
        pipWindow.addEventListener('pagehide', () => {
          document.body.appendChild(container);
          currentDoc = document;
          currentDoc.getElementById('copyBtn').onclick = handleCopy;
        });
        return;
      } catch (e) {
        console.error("PiP failed, falling back to window.open", e);
      }
    }
    window.open(window.location.href, 'pip', 'width=390,height=520,scrollbars=no,resizable=yes');
  };
</script>
</body>
</html>
